[project]
name = "risk-monitor-agent"
version = "1.0.0"
description = "Transaction risk monitor agent (Strands + Amazon Bedrock + AgentCore Runtime)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pydantic.PydanticDeprecatedSince20",
]

[tool.ruff]
line-length = 125
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S104", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B017"]
